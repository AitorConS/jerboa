# unikernel.toml — full build + run spec for a PostgreSQL unikernel.
#
# A single file describes how the image is assembled (like a Dockerfile) and the
# defaults used when it runs (like a compose service). The package is declared
# in [build] pkgs below, so building needs no extra flags:
#
#   jerboa build . --name postgresql
#
# Select a different file with -f/--file:
#
#   jerboa build . -f ./unikernel.toml --name postgresql

[build]
# Build driver: go | node | python | rust | raw.
# "raw" performs no compilation — the binary comes from a package and is
# named by [program] below. Use it for prebuilt runtimes (databases, the JVM…).
lang = "raw"

# Packages merged into the image. Declared here so `jerboa build .` needs no
# --pkg flags; any command-line --pkg refs append to this list.
pkgs = ["eyberg/postgresql:11.3.0"]

# Where packages come from: "ops" (the default — repo.ops.city ecosystem) or
# "jerboa" (first-party index / locally created packages).
pkg_source = "ops"

# Minimum image size passed to mkfs. Reserves scratch space *inside the root
# image* (lost on stop) for runtime writes — temp tablespaces, logs, sockets,
# and the database files themselves under /db (see -D below).
disk_size = "1G"

# Shell commands run before packaging — the Dockerfile `RUN` analogue. Use for
# build steps (npm run build, collectstatic, mvn package…). None needed here
# since the binaries come prebuilt from the ops package.
# run = ["echo build step"]

[program]
# raw-only: the runtime binary, resolved from the package files by exact guest
# path, path suffix, or basename. Give the FULL in-image path so it resolves to
# the real install tree, not a same-named launcher stub at the image root: the
# eyberg/postgresql package ships both /postgres (root) and the real binary under
# /usr/local/pgsql/bin. The program is executed from its real path, so postgres
# can locate its install prefix (../share, ../lib) via /proc/self/exe and resolve
# $ORIGIN-relative shared libraries such as libpq.so.5.
path = "/usr/local/pgsql/bin/postgres"

# argv[1..] passed to the program (argv[0] is the program path itself).
# The eyberg/postgresql package ships a PRE-INITIALISED data directory baked into
# the image at /db (it contains PG_VERSION, base/, global/ …), so no initdb step
# is needed — initdb cannot run in a unikernel anyway because it fork/execs the
# postgres bootstrap process and nanos is single-process. Point -D at that /db.
args = [
  "-D", "/db",
  "-p", "5432",
  "-c", "listen_addresses=*",
  # Use the open pg_hba.conf copied into the image from this directory (see
  # pg_hba.conf) so clients on a jerboa bridge network can connect. The baked
  # data dir's own pg_hba only trusts localhost and the old SLIRP host.
  "-c", "hba_file=/pg_hba.conf",
]

[env]
# Environment baked into the image, highest priority (overrides package/driver
# env for the same key). Postgres needs none here; shown for completeness.
# LANG = "en_US.UTF-8"

[run]
# Defaults baked into the image manifest and inherited by `jerboa run` unless a
# flag overrides them. Precedence: run flag > [run] value > built-in default.
memory = "512M"          # inherited unless `jerboa run --memory ...` is given
cpus = 1                 # inherited unless `jerboa run --cpus ...` is given
ports = ["5432:5432"]    # host:guest publish maps; applied when the VM joins a
                         # network (jerboa run --network ...) and no -p is given

# Persistence: /db in the root image is ephemeral. For data that survives
# recreating the VM, seed a TFS volume with the initialized cluster once and
# mount it at /db (the volume shadows the baked copy). Create + seed in one step:
#
#   jerboa volume create pgdata --size 1G --seed-pkg eyberg/postgresql:11.3.0 --src /db
#   jerboa run postgresql -v pgdata:/db --network pgnet -p 5432:5432
#
# Stop the VM with `jerboa stop`. On QEMU (and Firecracker on macOS) the guest is
# told to shut down, so postgres checkpoints and removes postmaster.pid. On
# Firecracker on Linux there is no such channel, so the lock stays behind and the
# next boot needs postmaster.pid deleted from the volume — the data itself
# survives, postgres replays its write-ahead log. See docs/troubleshooting.md.
