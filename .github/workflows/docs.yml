name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "VERSION.md"
      - "kernel/VERSION"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate version data from source files
        run: |
          mkdir -p docs/_data
          {
            echo "# Auto-generated by .github/workflows/docs.yml from VERSION.md and kernel/VERSION."
            echo "cli: $(cat VERSION.md)"
            echo "kernel: $(cat kernel/VERSION)"
          } > docs/_data/versions.yml
          cat docs/_data/versions.yml

      - name: Install dependencies
        run: bundle install
        working-directory: docs

      - name: Build site
        run: bundle exec jekyll build --destination _site --baseurl ""
        working-directory: docs
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
