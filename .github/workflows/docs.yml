name: Deploy Docs
'on':
  push:
    branches:
    - main
    paths:
    - docs/**
    - VERSION.md
    - kernel/VERSION
    - .github/workflows/docs.yml
  workflow_dispatch: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4
      with:
        ruby-version: '3.3'
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: true
    - name: Generate version data from signed stable release
      run: |-
        set -euo pipefail
        curl -fsSL --retry 3 https://releases.jerboa.dev/channels/stable.json -o stable.json
        curl -fsSL --retry 3 https://releases.jerboa.dev/channels/stable.json.minisig -o stable.json.minisig
        go run ./cmd/jerboa-verify stable.json
        python3 - <<'DATA'
        import json,pathlib
        components=json.load(open('stable.json'))['components']
        pathlib.Path('docs/_data/versions.yml').write_text('cli: '+components['cli']['version'].removeprefix('v')+'\nkernel: '+components['kernel']['version'].removeprefix('v')+'\n')
        DATA
    - name: Install dependencies
      run: bundle install
      working-directory: docs
    - name: Build site
      run: bundle exec jekyll build --destination _site --baseurl ""
      working-directory: docs
      env:
        JEKYLL_ENV: production
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      with:
        path: docs/_site/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
