name: Build release candidate
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Version in VERSION.md, e.g. v0.54.3
        required: true
        type: string
      desktop_sha:
        description: Exact 40-character JerboaDesktop commit SHA
        required: true
        type: string
      runtime_sha:
        description: Exact Firecracker commit SHA
        required: true
        type: string
        default: 6750fc374d4758a8181d75e5299e7137a110dd41
      kernel_version:
        description: Existing verified kernel version
        required: true
        type: string
        default: v0.2.0
permissions:
  contents: read
concurrency:
  group: candidate-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  inputs:
    name: Lock candidate inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lock.outputs.version }}
      desktop_sha: ${{ steps.lock.outputs.desktop_sha }}
      runtime_sha: ${{ steps.lock.outputs.runtime_sha }}
      kernel_version: ${{ steps.lock.outputs.kernel_version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Validate immutable inputs
      run: python3 scripts/release/candidate.py lock
      id: lock
      env:
        DESKTOP_SHA: ${{ inputs.desktop_sha }}
        RUNTIME_SHA: ${{ inputs.runtime_sha }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        VERSION: ${{ inputs.version }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-lock
        path: release-lock.json
        if-no-files-found: error
        retention-days: 30
  validate:
    needs:
    - inputs
    uses: ./.github/workflows/validate.yml
    with:
      full: true
    secrets: inherit
  build-release:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs:
    - inputs
    - validate
    timeout-minutes: 15
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    strategy:
      matrix:
        include:
        - goos: linux
          goarch: amd64
          ext: ''
        - goos: linux
          goarch: arm64
          ext: ''
        - goos: windows
          goarch: amd64
          ext: .exe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: true
    - name: Read version
      id: read-version
      run: |
        VERSION="${RELEASE_VERSION}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "CLI_VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Build jerboa
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -ldflags="-s -w -X main.version=${CLI_VERSION}" \
          -o dist/jerboa-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
          ./cmd/jerboa
    - name: Build jerboad
      if: matrix.goos == 'linux'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -ldflags="-s -w -X main.version=${CLI_VERSION}" \
          -o dist/jerboad-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
          ./cmd/jerboad
    - name: Record CLI candidate hash
      if: matrix.goos == 'windows'
      run: python3 scripts/release/candidate.py cli --file dist/jerboa-windows-amd64.exe --version "$CLI_VERSION"
        --out dist/manifest.json
    - name: Upload binaries
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/
    env:
      RELEASE_VERSION: ${{ needs.inputs.outputs.version }}
  build-distro:
    name: Build WSL2 Distro Rootfs
    runs-on: ubuntu-latest
    needs:
    - inputs
    - validate
    - build-release
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: kernel-linux
        path: .
    - name: Restore tested kernel
      run: tar -xzf kernel-linux.tar.gz
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: binaries-linux-amd64
        path: dist
    - name: Build distro rootfs
      run: bash distro/build.sh
    - name: Upload rootfs artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: distro-rootfs
        path: jerboa-rootfs-amd64.tar.gz
    env:
      RELEASE_VERSION: ${{ needs.inputs.outputs.version }}
      VERSION: ${{ needs.inputs.outputs.version }}
      JERBOA_DAEMON_BINARY: dist/jerboad-linux-amd64
  build-macos:
    name: Native macOS runtime and Desktop DMG
    runs-on: macos-26
    needs:
    - inputs
    - validate
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      RELEASE_VERSION: ${{ needs.inputs.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        path: jerboa
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: AitorConS/firecracker-macos
        ref: ${{ needs.inputs.outputs.runtime_sha }}
        persist-credentials: false
        path: firecracker-macos
    - name: Checkout JerboaDesktop
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: AitorConS/JerboaDesktop
        token: ${{ secrets.DESKTOP_REPO_TOKEN }}
        path: desktop
        persist-credentials: false
        ref: ${{ needs.inputs.outputs.desktop_sha }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache-dependency-path: jerboa/go.sum
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - name: Install build prerequisites
      run: |
        set -euo pipefail
        test "$(uname -m)" = arm64
        test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
        # The image ships rustup/cargo but no ARM64 ELF binutils for the kernel.
        brew install aarch64-elf-binutils
        rustup toolchain install 1.97.0 --profile minimal
        for tool in aarch64-elf-as aarch64-elf-ld aarch64-elf-objcopy cargo codesign; do
          command -v "$tool"
        done
    - name: Build pinned Firecracker and relocatable dependencies
      working-directory: firecracker-macos
      run: |
        set -euo pipefail
        python3 experiments/hvf/distribution/build-native-deps.py
        GLIB_PREFIX="$PWD/experiments/hvf/build/distribution/native" sh experiments/hvf/build-native.sh
        # Offline license metadata needs workspace dependencies beyond the binary build.
        cargo +1.97.0 fetch --locked --target aarch64-apple-darwin
        python3 experiments/hvf/distribution/package.py "$RUNNER_TEMP/firecracker-package"
    - name: Build and test native Jerboa
      working-directory: jerboa
      run: |
        set -euo pipefail
        sh scripts/build-macos.sh --with-x86
        go test -race ./cmd/... ./internal/...
        python3 scripts/test_macos_distribution.py
        python3 scripts/test-install.py
    - name: Package and verify the relocatable runtime
      working-directory: jerboa
      run: |
        set -euo pipefail
        VERSION="${RELEASE_VERSION#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        python3 scripts/package-macos-distribution.py --jerboa-dir dist/macos-arm64 \
          --tools-dir dist/macos-arm64/tools \
          --firecracker-package "$RUNNER_TEMP/firecracker-package" \
          --output-dir dist/macos-distribution --version "$VERSION" \
          --source-date-epoch "$(git show -s --format=%ct HEAD)"
        BUNDLE="$PWD/dist/macos-distribution/jerboa-$VERSION-macos-arm64"
        # Checksums, ARM64 Mach-O, ad-hoc signatures, the Firecracker
        # Hypervisor entitlement, relocatable libraries and --version only.
        python3 scripts/verify-macos-distribution.py "$BUNDLE" --mode adhoc
        mkdir -p dist/macos-release
        cp "$BUNDLE/bin/jerboa" dist/macos-release/jerboa-darwin-arm64
        cp "$BUNDLE/bin/jerboad" dist/macos-release/jerboad-darwin-arm64
        # Desktop stages the same verified inputs: CLI, daemon and tools into
        # Resources/bin, Firecracker's dylibs into Resources/lib.
        JERBOA_VERSION_FILE="$PWD/VERSION.md" sh ../desktop/scripts/stage-macos.sh \
          "$PWD/dist/macos-arm64" "$RUNNER_TEMP/firecracker-package"
        test "$(cat ../desktop/vendor/native/engine-version.txt)" = "v$VERSION"
    - name: Build Desktop DMG
      working-directory: desktop
      run: |
        set -euo pipefail
        npm ci
        npm run typecheck
        node --test scripts/desktop-version.test.mjs
        # The app ships this release's engine, so it carries the same version.
        node --input-type=module -e "import { desktopVersion, syncDesktopVersion } from './scripts/desktop-version.mjs'; syncDesktopVersion('.', desktopVersion(process.env.VERSION))"
        npm run build
        # Ad-hoc app signature: Apple Silicon needs a valid seal to launch it.
        # signIgnore (electron-builder.yml) keeps Firecracker and its dylibs as built.
        npx electron-builder --mac --arm64 --publish never -c.mac.identity=-
    - name: Verify the app, bundled engine and DMG
      working-directory: desktop
      run: |
        set -euo pipefail
        APP="dist/mac-arm64/Jerboa Desktop.app"
        RES="$APP/Contents/Resources"
        DMG="dist/jerboa-desktop-$VERSION-macos-arm64.dmg"
        codesign --verify --deep --strict --verbose=2 "$APP"
        # Firecracker must keep the Hypervisor entitlement or HVF refuses VMs.
        codesign -d --entitlements - "$RES/bin/firecracker" 2>/dev/null | grep -q com.apple.security.hypervisor
        test "$(cat "$RES/bin/engine-version.txt")" = "v$VERSION"
        # Run from inside the app: Firecracker resolves @loader_path/../lib.
        "$RES/bin/jerboa" --version
        "$RES/bin/jerboad" --version
        "$RES/bin/firecracker" --version
        hdiutil verify "$DMG"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: binaries-macos
        path: jerboa/dist/macos-release/*
        if-no-files-found: error
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: desktop-macos
        path: desktop/dist/jerboa-desktop-*-macos-arm64.dmg
        if-no-files-found: error
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: macos-app
        path: desktop/dist/jerboa-desktop-*-macos-arm64.zip
        if-no-files-found: error
        retention-days: 30
  windows:
    name: Package Windows candidate
    runs-on: windows-latest
    needs:
    - inputs
    - build-release
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: AitorConS/JerboaDesktop
        ref: ${{ needs.inputs.outputs.desktop_sha }}
        token: ${{ secrets.DESKTOP_REPO_TOKEN }}
        persist-credentials: false
        path: desktop
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '22'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: binaries-windows-amd64
        path: cli
    - name: Stage candidate CLI with explicit version and checksum
      run: |-
        ./cli/jerboa-windows-amd64.exe --version
        cd desktop
        npm ci
        node scripts/stage-candidate.mjs ../cli/manifest.json ../cli/jerboa-windows-amd64.exe "$VERSION"
        npm run typecheck
        node --test scripts/desktop-version.test.mjs scripts/stage-candidate.test.mjs
        npm run build
        npx electron-builder --win --publish never
      env:
        VERSION: ${{ needs.inputs.outputs.version }}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: desktop-windows
        path: |-
          desktop/dist/*.exe
          desktop/dist/*.blockmap
          desktop/dist/latest.yml
        if-no-files-found: error
        retention-days: 30
  windows-smoke:
    name: Validate Windows candidate
    needs:
    - windows
    - build-distro
    environment: kvm
    runs-on:
    - self-hosted
    - windows
    - kvm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
    - name: Put Git Bash ahead of WSL bash on PATH
      shell: powershell
      run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
    - name: Pre-clean leftover jerboa state
      shell: powershell
      run: |
        # A pristine machine has nothing installed, so the uninstaller may be
        # absent. Start-Process raises a *terminating* error on a missing
        # -FilePath that -ErrorAction can't swallow, so guard with Test-Path
        # (same as the Cleanup step) instead of relying on SilentlyContinue.
        $uninst = 'C:\jerboa-desktop\Uninstall Jerboa Desktop.exe'
        if (Test-Path $uninst) {
          Start-Process -Wait -FilePath $uninst -ArgumentList '/S' -ErrorAction SilentlyContinue
        }
        # WSL may be absent on this host. Run through cmd with its own
        # redirection so the wsl stub's "not installed" message never becomes
        # a PowerShell NativeCommandError that fails the step; there's simply
        # nothing to unregister then.
        cmd /c "wsl.exe --unregister jerboa >nul 2>nul"
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
          'C:\jerboa-desktop', "$env:USERPROFILE\.jerboa", "$env:LOCALAPPDATA\jerboa"
        exit 0
    - name: Checkout jerboa (examples + smoke script)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: desktop-windows
        path: desktop/dist
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: distro-rootfs
        path: distro
    - name: Silent-install the desktop app
      shell: powershell
      run: |
        $installer = Get-ChildItem desktop/dist/jerboa-desktop-setup-*.exe | Select-Object -First 1
        if (-not $installer) { throw "installer .exe not found in desktop/dist" }
        Write-Host "installing $($installer.FullName)"
        # NSIS assisted installer: /S silent, /D sets the install dir (must be
        # last, unquoted). Start-Process -Wait blocks until it finishes.
        Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S','/D=C:\jerboa-desktop'
        $cli = 'C:\jerboa-desktop\resources\bin\jerboa.exe'
        if (-not (Test-Path $cli)) { throw "installer did not place jerboa.exe at $cli" }
    - name: Run installer smoke (provision engine + boot 3 unikernels)
      env:
        JERBOA_BIN: /c/jerboa-desktop/resources/bin
      run: |
        set -euo pipefail
        export JERBOA_ROOTFS="$(pwd)/distro/jerboa-rootfs-amd64.tar.gz"
        export JERBOA_EXAMPLES="$(pwd)/examples"
        test -f "$JERBOA_ROOTFS" || { echo "rootfs not found at $JERBOA_ROOTFS"; exit 1; }
        bash scripts/windows-install-smoke.sh
    - name: "Cleanup \u2014 uninstall, unregister distro, wipe host state"
      if: always()
      shell: powershell
      run: |
        $uninst = 'C:\jerboa-desktop\Uninstall Jerboa Desktop.exe'
        if (Test-Path $uninst) {
          Start-Process -Wait -FilePath $uninst -ArgumentList '/S' -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3   # NSIS uninstaller relaunches from temp; let it finish
        }
        # WSL may be absent on this host. Run through cmd with its own
        # redirection so the wsl stub's "not installed" message never becomes
        # a PowerShell NativeCommandError that fails the step; there's simply
        # nothing to unregister then.
        cmd /c "wsl.exe --unregister jerboa >nul 2>nul"
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
          'C:\jerboa-desktop', "$env:USERPROFILE\.jerboa", "$env:LOCALAPPDATA\jerboa"
        exit 0
  assemble:
    name: Assemble verified candidate
    runs-on: ubuntu-latest
    needs:
    - inputs
    - validate
    - build-release
    - build-distro
    - build-macos
    - windows
    - windows-smoke
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: true
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: binaries-*
        merge-multiple: true
        path: dist
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: desktop-windows
        path: desktop-windows
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: desktop-macos
        path: desktop-macos
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: distro-rootfs
        path: distro
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-lock
        path: .
    - name: Build release utilities
      run: |-
        go build -o bin/jerboa-manifest ./cmd/jerboa-manifest
        go build -o bin/jerboa-sign ./cmd/jerboa-sign
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: macos-app
        path: native-macos
    - name: Assemble and sign complete inventory
      run: python3 scripts/release/candidate.py assemble
      env:
        JERBOA_MINISIGN_SEED: ${{ secrets.JERBOA_MINISIGN_SEED }}
        KEY_ID: ${{ vars.JERBOA_MINISIGN_KEYID }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-candidate
        path: candidate
        if-no-files-found: error
        retention-days: 30
    - name: Summary
      run: python3 scripts/release/candidate.py summary
