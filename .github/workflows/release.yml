name: Build release candidate
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Version in VERSION.md, e.g. v0.54.3
        required: true
        type: string
      desktop_sha:
        description: Exact 40-character JerboaDesktop commit SHA
        required: true
        type: string
      runtime_sha:
        description: Exact Firecracker commit SHA
        required: true
        type: string
        default: 6750fc374d4758a8181d75e5299e7137a110dd41
      kernel_version:
        description: Kernel version (kernel/VERSION for build; published version for stable)
        required: true
        type: string
      kernel_source:
        description: Build kernel from this revision or explicitly reuse published tools
        required: true
        type: choice
        options:
        - build
        - stable
        default: build
permissions:
  contents: read
concurrency:
  group: candidate-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  inputs:
    name: Lock candidate inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lock.outputs.version }}
      desktop_sha: ${{ steps.lock.outputs.desktop_sha }}
      runtime_sha: ${{ steps.lock.outputs.runtime_sha }}
      kernel_version: ${{ steps.lock.outputs.kernel_version }}
      kernel_source: ${{ steps.lock.outputs.kernel_source }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Validate immutable inputs
      run: python3 scripts/release/candidate.py lock
      id: lock
      env:
        DESKTOP_SHA: ${{ inputs.desktop_sha }}
        RUNTIME_SHA: ${{ inputs.runtime_sha }}
        KERNEL_VERSION: ${{ inputs.kernel_version }}
        KERNEL_SOURCE: ${{ inputs.kernel_source }}
        VERSION: ${{ inputs.version }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-lock
        path: release-lock.json
        if-no-files-found: error
        retention-days: 30
  validate:
    needs:
    - inputs
    uses: ./.github/workflows/validate.yml
    with:
      full: true
  kernel-stage:
    name: Stage selected kernel toolset
    runs-on: ubuntu-latest
    needs: [inputs, validate]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.3
        cache: true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-lock
        path: .
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: needs.inputs.outputs.kernel_source == 'build'
      with:
        name: kernel-linux
        path: .
    - name: Restore validated build output
      if: needs.inputs.outputs.kernel_source == 'build'
      run: tar -xzf kernel-linux.tar.gz
    - name: Stage toolset and record hashes
      run: python3 scripts/release/candidate.py kernel
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: selected-kernel
        path: kernel-candidate/
        if-no-files-found: error
        retention-days: 30
  kernel-test:
    name: Boot selected QEMU and Firecracker kernels
    needs: [kernel-stage]
    environment: kvm
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-lock
        path: .
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: selected-kernel
        path: kernel-candidate
    - name: Check KVM and runner tools
      run: |
        test -r /dev/kvm && test -w /dev/kvm
        command -v cc
        command -v qemu-system-x86_64
        command -v firecracker
    - name: Boot exact staged kernels
      run: python3 scripts/release/validate-kernel.py --work "$RUNNER_TEMP/kernel-boot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: kernel-boot-logs
        path: ${{ runner.temp }}/kernel-boot-${{ github.run_id }}-${{ github.run_attempt }}/*.log
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: validated-kernel
        path: kernel-candidate/
        if-no-files-found: error
        retention-days: 30
  build-release:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs:
    - inputs
    - validate
    timeout-minutes: 15
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    strategy:
      matrix:
        include:
        - goos: linux
          goarch: amd64
          ext: ''
        - goos: linux
          goarch: arm64
          ext: ''
        - goos: windows
          goarch: amd64
          ext: .exe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.3
        cache: true
    - name: Read version
      id: read-version
      run: |
        VERSION="${RELEASE_VERSION}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "CLI_VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Build jerboa
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -ldflags="-s -w -X main.version=${CLI_VERSION}" \
          -o dist/jerboa-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
          ./cmd/jerboa
    - name: Build jerboad
      if: matrix.goos == 'linux'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -ldflags="-s -w -X main.version=${CLI_VERSION}" \
          -o dist/jerboad-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
          ./cmd/jerboad
    - name: Record CLI candidate hash
      if: matrix.goos == 'windows'
      run: python3 scripts/release/candidate.py cli --file dist/jerboa-windows-amd64.exe --version "$CLI_VERSION"
        --out dist/manifest.json
    - name: Upload binaries
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/
    env:
      RELEASE_VERSION: ${{ needs.inputs.outputs.version }}
  build-distro:
    name: Build WSL2 Distro Rootfs
    runs-on: ubuntu-latest
    needs:
    - inputs
    - validate
    - build-release
    - kernel-test
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.3
        cache: true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: validated-kernel
        path: kernel-candidate
    # The KVM runner only adds its boot report: everything else must match
    # the toolset selected on a GitHub-hosted runner.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: selected-kernel
        path: kernel-selected
    - name: Check the boot-validated kernel is the selected one
      run: python3 scripts/release/candidate.py selected
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: binaries-linux-amd64
        path: dist
    - name: Build distro rootfs
      run: bash distro/build.sh
    - name: Upload rootfs artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: distro-rootfs
        path: jerboa-rootfs-amd64.tar.gz
    env:
      RELEASE_VERSION: ${{ needs.inputs.outputs.version }}
      VERSION: ${{ needs.inputs.outputs.version }}
      JERBOA_DAEMON_BINARY: dist/jerboad-linux-amd64
      JERBOA_KERNEL_TOOLSET: kernel-candidate
  build-macos:
    name: Native macOS runtime and Desktop DMG
    environment: release
    runs-on: macos-26
    needs:
    - inputs
    - validate
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      RELEASE_VERSION: ${{ needs.inputs.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        path: jerboa
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: AitorConS/firecracker-macos
        ref: ${{ needs.inputs.outputs.runtime_sha }}
        persist-credentials: false
        path: firecracker-macos
    - name: Checkout JerboaDesktop
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: AitorConS/JerboaDesktop
        token: ${{ secrets.DESKTOP_REPO_TOKEN }}
        path: desktop
        persist-credentials: false
        ref: ${{ needs.inputs.outputs.desktop_sha }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.3
        cache-dependency-path: jerboa/go.sum
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - name: Install build prerequisites
      run: |
        set -euo pipefail
        test "$(uname -m)" = arm64
        test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
        # The image ships rustup/cargo but no ARM64 ELF binutils for the kernel.
        brew install aarch64-elf-binutils
        rustup toolchain install 1.97.0 --profile minimal
        for tool in aarch64-elf-as aarch64-elf-ld aarch64-elf-objcopy cargo codesign; do
          command -v "$tool"
        done
    - name: Build pinned Firecracker and relocatable dependencies
      working-directory: firecracker-macos
      run: |
        set -euo pipefail
        python3 experiments/hvf/distribution/build-native-deps.py
        GLIB_PREFIX="$PWD/experiments/hvf/build/distribution/native" sh experiments/hvf/build-native.sh
        # Offline license metadata needs workspace dependencies beyond the binary build.
        cargo +1.97.0 fetch --locked --target aarch64-apple-darwin
        python3 experiments/hvf/distribution/package.py "$RUNNER_TEMP/firecracker-package"
    - name: Build and test native Jerboa
      working-directory: jerboa
      run: |
        set -euo pipefail
        sh scripts/build-macos.sh --with-x86
        go test -race ./cmd/... ./internal/...
        python3 scripts/test_macos_distribution.py
        python3 scripts/test-install.py
    - name: Package and verify the relocatable runtime
      working-directory: jerboa
      run: |
        set -euo pipefail
        VERSION="${RELEASE_VERSION#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        python3 scripts/package-macos-distribution.py --jerboa-dir dist/macos-arm64 \
          --tools-dir dist/macos-arm64/tools \
          --firecracker-package "$RUNNER_TEMP/firecracker-package" \
          --output-dir dist/macos-distribution --version "$VERSION" \
          --source-date-epoch "$(git show -s --format=%ct HEAD)"
        BUNDLE="$PWD/dist/macos-distribution/jerboa-$VERSION-macos-arm64"
        # Checksums, ARM64 Mach-O, ad-hoc signatures, the Firecracker
        # Hypervisor entitlement, relocatable libraries and --version only.
        python3 scripts/verify-macos-distribution.py "$BUNDLE" --mode adhoc
        mkdir -p dist/macos-release
        cp "$BUNDLE/bin/jerboa" dist/macos-release/jerboa-darwin-arm64
        cp "$BUNDLE/bin/jerboad" dist/macos-release/jerboad-darwin-arm64
        # Desktop stages the same verified inputs: CLI, daemon and tools into
        # Resources/bin, Firecracker's dylibs into Resources/lib.
        JERBOA_VERSION_FILE="$PWD/VERSION.md" sh ../desktop/scripts/stage-macos.sh \
          "$PWD/dist/macos-arm64" "$RUNNER_TEMP/firecracker-package"
        test "$(cat ../desktop/vendor/native/engine-version.txt)" = "v$VERSION"
    - name: Build Desktop DMG
      working-directory: desktop
      run: |
        set -euo pipefail
        npm ci
        npm run typecheck
        node --test scripts/desktop-version.test.mjs
        # The app ships this release's engine, so it carries the same version.
        node --input-type=module -e "import { desktopVersion, syncDesktopVersion } from './scripts/desktop-version.mjs'; syncDesktopVersion('.', desktopVersion(process.env.VERSION))"
        npm run build
        # Ad-hoc app signature: Apple Silicon needs a valid seal to launch it.
        # signIgnore (electron-builder.yml) keeps Firecracker and its dylibs as built.
        npx electron-builder --mac --arm64 --publish never -c.mac.identity=-
    - name: Verify the app, bundled engine and DMG
      working-directory: desktop
      run: |
        set -euo pipefail
        APP="dist/mac-arm64/Jerboa Desktop.app"
        RES="$APP/Contents/Resources"
        DMG="dist/jerboa-desktop-$VERSION-macos-arm64.dmg"
        codesign --verify --deep --strict --verbose=2 "$APP"
        # Firecracker must keep the Hypervisor entitlement or HVF refuses VMs.
        codesign -d --entitlements - "$RES/bin/firecracker" 2>/dev/null | grep -q com.apple.security.hypervisor
        test "$(cat "$RES/bin/engine-version.txt")" = "v$VERSION"
        # Run from inside the app: Firecracker resolves @loader_path/../lib.
        "$RES/bin/jerboa" --version
        "$RES/bin/jerboad" --version
        "$RES/bin/firecracker" --version
        hdiutil verify "$DMG"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: binaries-macos
        path: jerboa/dist/macos-release/*
        if-no-files-found: error
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-macos
        path: desktop/dist/jerboa-desktop-*-macos-arm64.dmg
        if-no-files-found: error
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: macos-app
        path: desktop/dist/jerboa-desktop-*-macos-arm64.zip
        if-no-files-found: error
        retention-days: 30
    # The native mkfs, published beside a newly built kernel so clients can
    # assemble recipes for that toolset version on macOS.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mkfs-darwin-arm64
        path: jerboa/dist/macos-arm64/tools/mkfs
        if-no-files-found: error
        retention-days: 30
  determinism:
    name: mkfs determinism across hosts
    needs:
    - inputs
    uses: ./.github/workflows/determinism.yml
  kernel-tools-arm64:
    name: Native Linux ARM64 mkfs
    runs-on: ubuntu-24.04-arm
    needs:
    - inputs
    - validate
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Build mkfs for Linux ARM64 hosts
      run: make -C kernel tools
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mkfs-linux-arm64
        path: kernel/output/tools/bin/mkfs
        if-no-files-found: error
        retention-days: 30
  windows:
    name: Package Windows candidate
    environment: release
    runs-on: windows-latest
    needs:
    - inputs
    - build-release
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: AitorConS/JerboaDesktop
        ref: ${{ needs.inputs.outputs.desktop_sha }}
        token: ${{ secrets.DESKTOP_REPO_TOKEN }}
        persist-credentials: false
        path: desktop
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: binaries-windows-amd64
        path: cli
    - name: Stage candidate CLI with explicit version and checksum
      run: |-
        ./cli/jerboa-windows-amd64.exe --version
        cd desktop
        npm ci
        node scripts/stage-candidate.mjs ../cli/manifest.json ../cli/jerboa-windows-amd64.exe "$VERSION"
        npm run typecheck
        node --test scripts/desktop-version.test.mjs scripts/stage-candidate.test.mjs
        npm run build
      env:
        VERSION: ${{ needs.inputs.outputs.version }}
    # Only packaging sees the code-signing certificate: dependency install
    # scripts and the build above run without it (npmRebuild is off in
    # electron-builder.yml, so packaging runs no install scripts).
    - name: Package and sign the Windows installer
      working-directory: desktop
      run: npx --no-install electron-builder --win --publish never
      env:
        VERSION: ${{ needs.inputs.outputs.version }}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-windows
        path: |-
          desktop/dist/*.exe
          desktop/dist/*.blockmap
          desktop/dist/latest.yml
        if-no-files-found: error
        retention-days: 30
  # The installer smoke needs a Windows machine with WSL2, which hosted runners
  # do not offer. Each run starts its own EC2 instance (jerboa-infra prepares the
  # image, launch template and role), registers it as a single-job runner with a
  # label unique to this run, and terminates it afterwards.
  windows-runner-up:
    name: Start Windows smoke runner
    environment: windows-runner
    runs-on: ubuntu-latest
    needs:
    - windows
    - build-distro
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    outputs:
      instance_id: ${{ steps.launch.outputs.instance_id }}
      name: ${{ steps.names.outputs.name }}
      label: ${{ steps.names.outputs.label }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Check the windows-runner environment
      run: bash scripts/release/windows-runner.sh check
      env:
        WINDOWS_RUNNER_ROLE_ARN: ${{ vars.WINDOWS_RUNNER_ROLE_ARN }}
        WINDOWS_RUNNER_REGION: ${{ vars.WINDOWS_RUNNER_REGION }}
        WINDOWS_RUNNER_LAUNCH_TEMPLATE_ID: ${{ vars.WINDOWS_RUNNER_LAUNCH_TEMPLATE_ID }}
        WINDOWS_RUNNER_APP_ID: ${{ vars.WINDOWS_RUNNER_APP_ID }}
        HAS_APP_KEY: ${{ secrets.WINDOWS_RUNNER_APP_PRIVATE_KEY != '' }}
    - name: Name this run's runner
      id: names
      run: |-
        echo "name=jerboa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"
        echo "label=jerboa-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"
    - name: Mint a runner registration token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ vars.WINDOWS_RUNNER_APP_ID }}
        private-key: ${{ secrets.WINDOWS_RUNNER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: jerboa
        permission-administration: write
    - name: Launch the instance and wait for its runner
      id: launch
      run: bash scripts/release/windows-runner.sh launch
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        ROLE_ARN: ${{ vars.WINDOWS_RUNNER_ROLE_ARN }}
        AWS_REGION: ${{ vars.WINDOWS_RUNNER_REGION }}
        LAUNCH_TEMPLATE_ID: ${{ vars.WINDOWS_RUNNER_LAUNCH_TEMPLATE_ID }}
        RUNNER_NAME: ${{ steps.names.outputs.name }}
        RUNNER_LABEL: ${{ steps.names.outputs.label }}
  windows-smoke:
    name: Validate Windows candidate
    needs:
    - windows
    - build-distro
    - windows-runner-up
    runs-on:
    - self-hosted
    - windows
    - x64
    - ${{ needs.windows-runner-up.outputs.label }}
    permissions:
      contents: read
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
    - name: Put Git Bash ahead of WSL bash on PATH
      shell: powershell
      run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'
    - name: Checkout jerboa (examples + smoke script)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: desktop-windows
        path: desktop/dist
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: distro-rootfs
        path: distro
    - name: Silent-install the desktop app
      shell: powershell
      run: |
        $installer = Get-ChildItem desktop/dist/jerboa-desktop-setup-*.exe | Select-Object -First 1
        if (-not $installer) { throw "installer .exe not found in desktop/dist" }
        Write-Host "installing $($installer.FullName)"
        # NSIS assisted installer: /S silent, /D sets the install dir (must be
        # last, unquoted). Start-Process -Wait blocks until it finishes.
        Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S','/D=C:\jerboa-desktop'
        $cli = 'C:\jerboa-desktop\resources\bin\jerboa.exe'
        if (-not (Test-Path $cli)) { throw "installer did not place jerboa.exe at $cli" }
    - name: Run installer smoke (provision engine + boot 3 unikernels)
      env:
        JERBOA_BIN: /c/jerboa-desktop/resources/bin
      run: |
        set -euo pipefail
        export JERBOA_ROOTFS="$(pwd)/distro/jerboa-rootfs-amd64.tar.gz"
        export JERBOA_EXAMPLES="$(pwd)/examples"
        test -f "$JERBOA_ROOTFS" || { echo "rootfs not found at $JERBOA_ROOTFS"; exit 1; }
        bash scripts/windows-install-smoke.sh
    # The instance is discarded after the run; uninstalling still exercises the
    # uninstaller and leaves nothing behind should the machine be kept for a look.
    - name: "Cleanup \u2014 uninstall, unregister distro, wipe host state"
      if: always()
      shell: powershell
      run: |
        $uninst = 'C:\jerboa-desktop\Uninstall Jerboa Desktop.exe'
        if (Test-Path $uninst) {
          Start-Process -Wait -FilePath $uninst -ArgumentList '/S' -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3   # NSIS uninstaller relaunches from temp; let it finish
        }
        # Run through cmd with its own redirection so a wsl.exe error never
        # becomes a PowerShell NativeCommandError that fails the step.
        cmd /c "wsl.exe --unregister jerboa >nul 2>nul"
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
          'C:\jerboa-desktop', "$env:USERPROFILE\.jerboa", "$env:LOCALAPPDATA\jerboa"
        exit 0
  windows-runner-down:
    name: Stop Windows smoke runner
    if: always() && needs.windows-runner-up.outputs.instance_id != ''
    environment: windows-runner
    runs-on: ubuntu-latest
    needs:
    - windows-runner-up
    - windows-smoke
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Terminate the instance
      run: bash scripts/release/windows-runner.sh terminate
      env:
        ROLE_ARN: ${{ vars.WINDOWS_RUNNER_ROLE_ARN }}
        AWS_REGION: ${{ vars.WINDOWS_RUNNER_REGION }}
        INSTANCE_ID: ${{ needs.windows-runner-up.outputs.instance_id }}
    - name: Mint a runner management token
      id: app-token
      if: always()
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        app-id: ${{ vars.WINDOWS_RUNNER_APP_ID }}
        private-key: ${{ secrets.WINDOWS_RUNNER_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: jerboa
        permission-administration: write
    # The runner removes itself after its one job; a registration remains only
    # if the machine never picked the job up.
    - name: Remove the runner registration if it remains
      if: always() && steps.app-token.outcome == 'success'
      run: bash scripts/release/windows-runner.sh deregister
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        RUNNER_NAME: ${{ needs.windows-runner-up.outputs.name }}
  assemble:
    name: Assemble verified candidate
    environment: release
    runs-on: ubuntu-latest
    needs:
    - inputs
    - validate
    - kernel-test
    - build-release
    - build-distro
    - build-macos
    - kernel-tools-arm64
    - determinism
    - windows
    - windows-smoke
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: needs.inputs.outputs.kernel_source == 'build'
      with:
        name: mkfs-linux-arm64
        path: mkfs-linux-arm64
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: needs.inputs.outputs.kernel_source == 'build'
      with:
        name: mkfs-darwin-arm64
        path: mkfs-darwin-arm64
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.3
        cache: true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: binaries-*
        merge-multiple: true
        path: dist
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: desktop-windows
        path: desktop-windows
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: desktop-macos
        path: desktop-macos
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: distro-rootfs
        path: distro
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-lock
        path: .
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: validated-kernel
        path: kernel-candidate
    # The KVM runner only adds its boot report: everything else must match
    # the toolset selected on a GitHub-hosted runner.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: selected-kernel
        path: kernel-selected
    - name: Build release utilities
      run: |-
        go build -o bin/jerboa-manifest ./cmd/jerboa-manifest
        go build -o bin/jerboa-sign ./cmd/jerboa-sign
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: macos-app
        path: native-macos
    - name: Assemble and sign complete inventory
      run: python3 scripts/release/candidate.py assemble
      env:
        JERBOA_MINISIGN_SEED: ${{ secrets.JERBOA_MINISIGN_SEED }}
        KEY_ID: ${{ vars.JERBOA_MINISIGN_KEYID }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-candidate
        path: candidate
        if-no-files-found: error
        retention-days: 30
    - name: Summary
      run: python3 scripts/release/candidate.py summary
