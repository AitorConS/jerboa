name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.select.outputs.enabled }}
      full: ${{ steps.select.outputs.full }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Classify validation scope
      id: select
      run: python3 scripts/release/ci-select.py
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      full: ${{ needs.changes.outputs.full == 'true' }}
    secrets: inherit
    needs:
    - changes
    if: needs.changes.outputs.enabled == 'true'
  required:
    name: CI required
    runs-on: ubuntu-latest
    if: always()
    needs:
    - changes
    - validate
    steps:
    - name: Require selected validation
      run: |-
        test "$CHANGES" = success
        if [ "$ENABLED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
      env:
        CHANGES: ${{ needs.changes.result }}
        ENABLED: ${{ needs.changes.outputs.enabled }}
        RESULT: ${{ needs.validate.result }}
  timings:
    name: CI timings
    runs-on: ubuntu-latest
    if: always()
    needs:
    - required
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: python3 scripts/release/timings.py
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ci-timings
        path: ci-timings.json
