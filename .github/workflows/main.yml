name: CI

# The workflow itself always triggers on pushes/PRs to main (no workflow-level
# paths filter). Doc-only changes are filtered per-job instead: the `changes`
# job below decides whether non-doc files changed, and the build/test jobs skip
# when they did not.
#
# Why not paths-ignore here? Branch protection marks several of these jobs as
# required (go mod tidy, Lint, Unit Tests, Vulnerability Scan, Kernel Build). A
# workflow-level paths filter SKIPS THE WHOLE WORKFLOW for doc-only PRs, so those
# required checks are never reported and the PR is stuck forever on
# "Expected — Waiting for status to be reported". Skipping at the job level
# instead still emits a "skipped" conclusion for each required check, which
# branch protection accepts as passing — so doc-only PRs stay mergeable.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual publish escape hatch: run the workflow from the Actions tab with
  # `publish: true` to build and push a release to R2 without a VERSION bump
  # (e.g. a dry run, or re-publishing after an infra fix). Left false it runs
  # CI only, exactly like a normal push whose VERSION didn't change.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Build + publish a release to R2 even without a VERSION bump'
        type: boolean
        default: false

# Least privilege by default; jobs that publish elevate explicitly.
permissions:
  contents: read

# Prevent multiple concurrent release builds; cancel old ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether any non-documentation files changed. Doc-only changes
  # (docs/**, **.md) leave `code` == 'false', which makes every build/test job
  # below skip. The skipped jobs still report a "skipped" check to branch
  # protection (accepted as passing), so doc PRs merge without a code CI run.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.filter.outputs.code }}
      version: ${{ steps.filter.outputs.version }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine whether non-doc files changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Mirror the retired workflow-level paths-ignore: docs/** and **.md are
          # the only paths that do NOT warrant a code CI run.
          #
          # Indeterminate diff → run the FULL CI pipeline (so the required checks
          # still report and the branch stays mergeable) but never publish. Used
          # both for a new branch (all-zero before-SHA) and as the fallback when
          # we can't compute a reliable file list below.
          indeterminate() {
            echo "code=true"       >> "$GITHUB_OUTPUT"
            echo "version=false"   >> "$GITHUB_OUTPUT"
            # Don't force the heavy Windows installer smoke on an indeterminate
            # diff; the release path (version bump) runs it regardless.
            echo "installer=false" >> "$GITHUB_OUTPUT"
            echo "Indeterminate diff for range '${RANGE:-<none>}': running full CI, not publishing."
            exit 0
          }
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="${PR_BASE}...${PR_HEAD}"
          elif [ -n "${PUSH_BEFORE:-}" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            RANGE="${PUSH_BEFORE} ${PUSH_AFTER}"
          else
            indeterminate   # new branch / unknown (all-zero) base
          fi
          # A force-push can rewrite history so the base SHA is no longer
          # reachable, making `git diff` error out. Under `set -e` that would
          # fail the whole job and wedge the required checks, so guard it: any
          # diff failure (or an empty file list we can't classify) falls back to
          # the indeterminate path instead of skipping code CI.
          if ! FILES="$(git diff --name-only $RANGE)"; then
            echo "::warning::git diff failed for range '$RANGE' (unreachable base?)"
            indeterminate
          fi
          if [ -z "$FILES" ]; then
            echo "::warning::git diff produced no file list for range '$RANGE'"
            indeterminate
          fi
          echo "Changed files:"; echo "$FILES"
          CODE=false
          # Whether the VERSION file (the source of the release version — see the
          # publish-r2 job's `cat VERSION.md`) changed in this push. Gates the
          # build/publish-release chain so it only runs on a version bump.
          VERSION_CHANGED=false
          # Whether the PR touches the surface the Windows desktop-installer smoke
          # exercises (CLI/daemon, kernel, distro, examples, or the smoke itself).
          # Gates windows-installer-smoke on PRs so most PRs skip the heavy job.
          INSTALLER=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              VERSION.md) CODE=true ;;
              docs/*|*.md) ;;   # documentation only — no code CI needed
              *) CODE=true ;;
            esac
            case "$f" in
              cmd/*|internal/*|distro/*|kernel/*|examples/*|scripts/windows-install-smoke*.sh|.github/workflows/main.yml) INSTALLER=true ;;
            esac
            if [ "$f" = "VERSION.md" ]; then VERSION_CHANGED=true; fi
          done <<< "$FILES"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "installer=${INSTALLER}" >> "$GITHUB_OUTPUT"
          echo "Non-doc changes: ${CODE}; VERSION changed: ${VERSION_CHANGED}; installer surface: ${INSTALLER}"

  tidy-check:
    name: go mod tidy
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Check go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "go.mod or go.sum is out of sync. Run 'go mod tidy' locally and commit the result."
            exit 1
          }

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  unit-tests:
    name: Unit Tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Run unit tests
        # -shuffle=on randomises test/package order each run so an accidental
        # dependency between tests (shared global, execution-order coupling)
        # surfaces here instead of intermittently in production.
        run: go test ./cmd/... ./internal/... -race -shuffle=on -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Enforce coverage threshold (60%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !(${COVERAGE} + 0 < 60) }"; then
            echo "::error::Coverage ${COVERAGE}% is below the 60% minimum threshold. Add tests to bring it back up."
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-out
          path: coverage.out

  vuln-check:
    name: Vulnerability Scan
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

  fuzz-smoke:
    name: Fuzz Smoke
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Fuzz every target for a short burst
        # Fuzz targets guard the parsers on the untrusted RPC/CLI surface
        # (frame reader, resource-name validator, port-spec parser). A brief
        # burst per PR catches newly introduced crashers and property
        # violations; nightly.yml runs the same targets for much longer.
        run: |
          set -euo pipefail
          found=0
          for pkg in $(go list ./cmd/... ./internal/...); do
            for fn in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              found=1
              echo "::group::fuzz ${fn} (${pkg})"
              go test -run '^$' -fuzz "^${fn}$" -fuzztime=20s "$pkg"
              echo "::endgroup::"
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no fuzz targets found — expected FuzzFrameReader, FuzzValidateResourceName, etc."
            exit 1
          fi

  kernel-build:
    name: Kernel Build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cross-compiler toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib nasm qemu-utils

      - name: Build kernel
        run: make kernel

  integration-tests:
    name: Integration Tests
    needs: [lint, unit-tests]
    environment: kvm
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          # Self-hosted runner: the module cache persists on disk between runs,
          # so setup-go's tarball restore would extract over existing read-only
          # files and fail ("tar: Cannot open: File exists").
          cache: false

      - name: Check KVM
        run: |
          test -e /dev/kvm || (echo "/dev/kvm not found" && exit 1)
          test -r /dev/kvm && test -w /dev/kvm || (echo "Add runner user to kvm group: sudo usermod -aG kvm \$USER" && exit 1)

      - name: Build CLI binaries
        run: make build

      - name: Run integration tests
        run: go test -tags integration -count=1 -timeout 10m -v ./tests/integration/... ./internal/tools

  e2e-tests:
    name: E2E Tests
    needs: [lint, unit-tests, kernel-build]
    environment: kvm
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          # Self-hosted runner: the module cache persists on disk between runs,
          # so setup-go's tarball restore would extract over existing read-only
          # files and fail ("tar: Cannot open: File exists").
          cache: false

      - name: Check KVM
        run: |
          test -e /dev/kvm || (echo "/dev/kvm not found" && exit 1)
          test -r /dev/kvm && test -w /dev/kvm || (echo "Add runner user to kvm group: sudo usermod -aG kvm \$USER" && exit 1)

      - name: Build kernel and tools
        run: make kernel && make -C kernel tools

      - name: Build CLI binaries
        run: make build

      - name: Run E2E tests
        run: go test -tags e2e -count=1 -timeout 30m -v ./tests/e2e/...

  image-benchmarks:
    name: Image Build & Boot Benchmarks
    needs: [lint, unit-tests]
    environment: kvm
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          # Self-hosted runner: the module cache persists on disk between runs,
          # so setup-go's tarball restore would extract over existing read-only
          # files and fail ("tar: Cannot open: File exists").
          cache: false

      - name: Check KVM
        run: |
          test -e /dev/kvm || (echo "/dev/kvm not found" && exit 1)
          test -r /dev/kvm && test -w /dev/kvm || (echo "Add runner user to kvm group: sudo usermod -aG kvm \$USER" && exit 1)

      - name: Verify toolchain
        run: |
          for tool in gcc nasm qemu-system-x86_64 firecracker; do
            command -v "$tool" || { echo "ERROR: $tool not found — see runner setup docs (apt for gcc/nasm/qemu, GitHub releases for firecracker)"; exit 1; }
          done

      - name: Build kernel and tools
        run: make kernel && make -C kernel tools

      - name: Build CLI
        run: make build

      # ── QEMU phase ────────────────────────────────────────────────────────────

      - name: Start QEMU daemon
        run: |
          QEMU_SOCK=/tmp/bench-qemu.sock
          BENCH_STORE=$(mktemp -d)
          # Stage the freshly built kernel toolchain into one directory so the
          # daemon resolves mkfs/boot.img/kernel.img locally instead of
          # downloading a release.
          BENCH_TOOLS=$(mktemp -d)
          cp kernel/output/tools/bin/mkfs "${BENCH_TOOLS}/mkfs"
          cp kernel/output/platform/pc/boot/boot.img "${BENCH_TOOLS}/boot.img"
          cp kernel/output/platform/pc/bin/kernel.img "${BENCH_TOOLS}/kernel.img"
          # Also stage a locally-built Firecracker PVH kernel (strip debug from
          # the pc kernel.elf, which carries the PVH note). Booting THIS in the
          # Firecracker phase below is the gate that proves the repo can build a
          # bootable kernel-fc.img — instead of downloading the manually-produced
          # one from R2. See roadmap.md Phase 7 / kernel-release.yml.
          strip -g kernel/output/platform/pc/bin/kernel.elf -o "${BENCH_TOOLS}/kernel-fc.img"
          echo "QEMU_SOCK=${QEMU_SOCK}" >> "$GITHUB_ENV"
          echo "BENCH_STORE=${BENCH_STORE}" >> "$GITHUB_ENV"
          # Persist BENCH_TOOLS across steps: the Firecracker step below boots
          # ${BENCH_TOOLS}/kernel-fc.img. Each run step is a fresh shell, so
          # without this export the path collapses to "/kernel-fc.img" and the
          # gate silently boots whatever kernel happens to be at the FS root
          # instead of the freshly-built one.
          echo "BENCH_TOOLS=${BENCH_TOOLS}" >> "$GITHUB_ENV"
          ./dist/jerboad --host "unix://${QEMU_SOCK}" --tools-dir "${BENCH_TOOLS}" &
          echo "QEMU_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do [ -S "${QEMU_SOCK}" ] && break; sleep 0.5; done
          [ -S "${QEMU_SOCK}" ] || { echo "QEMU jerboad failed to start"; exit 1; }

      - name: Benchmark — build hello
        id: build-bench
        run: |
          BUILD_OUT=$(./dist/jerboa --host "unix://${QEMU_SOCK}" --store "${BENCH_STORE}" \
            build examples/hello --name bench-hello --lang go)
          echo "${BUILD_OUT}"
          BUILD_TIME=$(echo "${BUILD_OUT}" | grep -oP 'built in \K\S+')
          IMAGE_SIZE=$(echo "${BUILD_OUT}" | grep -oP '\d+(\.\d+)?[KMGT]?B' | head -1)
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "image_size=${IMAGE_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Benchmark — QEMU boot hello (3 runs)
        id: qemu-bench
        run: |
          TOTAL=0
          MIN=999999
          for i in 1 2 3; do
            T0=$(date +%s%N)
            ./dist/jerboa --host "unix://${QEMU_SOCK}" --store "${BENCH_STORE}" \
              run bench-hello:latest --attach --rm > /dev/null
            T1=$(date +%s%N)
            MS=$(( (T1 - T0) / 1000000 ))
            echo "QEMU run ${i}: ${MS}ms"
            TOTAL=$(( TOTAL + MS ))
            [ "${MS}" -lt "${MIN}" ] && MIN=${MS}
          done
          AVG=$(( TOTAL / 3 ))
          echo "avg_ms=${AVG}" >> "$GITHUB_OUTPUT"
          echo "min_ms=${MIN}" >> "$GITHUB_OUTPUT"

      - name: Stop QEMU daemon
        if: always()
        run: |
          [ -n "${QEMU_PID}" ] && kill "${QEMU_PID}" 2>/dev/null || true
          rm -f /tmp/bench-qemu.sock

      # ── Firecracker phase ─────────────────────────────────────────────────────

      - name: Start Firecracker daemon
        run: |
          FC_SOCK=/tmp/bench-fc.sock
          echo "FC_SOCK=${FC_SOCK}" >> "$GITHUB_ENV"
          # Boot the locally-built kernel-fc.img (staged above) rather than the
          # one published to R2, so this job validates the repo build recipe.
          # Fail loudly if it is missing — otherwise the gate would silently boot
          # a stray kernel and report a false pass.
          FC_KERNEL="${BENCH_TOOLS}/kernel-fc.img"
          [ -f "${FC_KERNEL}" ] || { echo "ERROR: locally-built kernel-fc.img not found at ${FC_KERNEL} (BENCH_TOOLS not propagated?)"; exit 1; }
          ./dist/jerboad --host "unix://${FC_SOCK}" --hypervisor firecracker \
            --fc-kernel "${FC_KERNEL}" &
          echo "FC_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do [ -S "${FC_SOCK}" ] && break; sleep 1; done
          [ -S "${FC_SOCK}" ] || { echo "Firecracker jerboad failed to start"; exit 1; }

      - name: Benchmark — Firecracker boot hello (3 runs)
        id: fc-bench
        run: |
          TOTAL=0
          MIN=999999
          for i in 1 2 3; do
            T0=$(date +%s%N)
            ./dist/jerboa --host "unix://${FC_SOCK}" --store "${BENCH_STORE}" \
              run bench-hello:latest --attach --rm > /dev/null
            T1=$(date +%s%N)
            MS=$(( (T1 - T0) / 1000000 ))
            echo "FC run ${i}: ${MS}ms"
            TOTAL=$(( TOTAL + MS ))
            [ "${MS}" -lt "${MIN}" ] && MIN=${MS}
          done
          AVG=$(( TOTAL / 3 ))
          echo "avg_ms=${AVG}" >> "$GITHUB_OUTPUT"
          echo "min_ms=${MIN}" >> "$GITHUB_OUTPUT"

      - name: Stop Firecracker daemon
        if: always()
        run: |
          [ -n "${FC_PID}" ] && kill "${FC_PID}" 2>/dev/null || true
          rm -f /tmp/bench-fc.sock

      # ── Results ───────────────────────────────────────────────────────────────

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Image Build & Boot Benchmarks"
            echo ""
            echo "App: \`examples/hello\` (Go, prints and exits)"
            echo ""
            echo "| Metric | QEMU | Firecracker |"
            echo "|--------|------|-------------|"
            echo "| Build time | ${{ steps.build-bench.outputs.build_time }} | — |"
            echo "| Image size | ${{ steps.build-bench.outputs.image_size }} | — |"
            echo "| Boot avg (3 runs) | ${{ steps.qemu-bench.outputs.avg_ms }}ms | ${{ steps.fc-bench.outputs.avg_ms }}ms |"
            echo "| Boot min (3 runs) | ${{ steps.qemu-bench.outputs.min_ms }}ms | ${{ steps.fc-bench.outputs.min_ms }}ms |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save results as JSON
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > bench-image.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "date": "${DATE}",
            "hello_build_time": "${{ steps.build-bench.outputs.build_time }}",
            "hello_image_size": "${{ steps.build-bench.outputs.image_size }}",
            "qemu_boot_avg_ms": ${{ steps.qemu-bench.outputs.avg_ms }},
            "qemu_boot_min_ms": ${{ steps.qemu-bench.outputs.min_ms }},
            "fc_boot_avg_ms": ${{ steps.fc-bench.outputs.avg_ms }},
            "fc_boot_min_ms": ${{ steps.fc-bench.outputs.min_ms }}
          }
          EOF

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-benchmarks-${{ github.run_id }}
          path: bench-image.json

  build-distro:
    name: Build WSL2 Distro Rootfs
    runs-on: ubuntu-latest
    needs: [changes, lint, unit-tests]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.version == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Install kernel toolchain deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib nasm qemu-utils

      - name: Build kernel and tools
        run: make kernel && make -C kernel tools

      - name: Build distro rootfs
        run: bash distro/build.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distro-rootfs
          path: jerboa-rootfs-amd64.tar.gz

  build-release:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: [changes, lint, unit-tests, integration-tests, e2e-tests]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.version == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    timeout-minutes: 15
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Read version
        id: read-version
        run: |
          VERSION="v$(cat VERSION.md | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CLI_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build jerboa
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${CLI_VERSION}" \
            -o dist/jerboa-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/jerboa

      # The daemon is linux-only (//go:build linux); skip it for other targets.
      - name: Build jerboad
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${CLI_VERSION}" \
            -o dist/jerboad-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/jerboad

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  windows-smoke-inputs:
    name: Build Windows Installer Smoke Inputs
    needs: [changes, lint, unit-tests]
    # Feeds windows-installer-smoke in BOTH contexts it runs: every release
    # (version bump / publish dispatch) and PRs that touch the installer surface.
    # Building here (rather than reusing build-release/build-distro) is what lets
    # the smoke run on PRs, where those release-gated jobs are skipped. On a
    # release this rebuilds the rootfs that build-distro also builds — cheap,
    # isolated ubuntu minutes, and keeps the PR and release paths identical.
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.version == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.installer == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Read version
        run: echo "CLI_VERSION=v$(cat VERSION.md | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Test installer smoke assertions
        run: bash scripts/windows-install-smoke-test.sh

      - name: Build Windows CLI
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${CLI_VERSION}" \
            -o dist/jerboa-windows-amd64.exe ./cmd/jerboa

      - name: Install kernel toolchain deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib nasm qemu-utils

      - name: Build kernel and tools
        run: make kernel && make -C kernel tools

      - name: Build distro rootfs
        run: bash distro/build.sh

      - name: Upload Windows CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-cli
          path: dist/jerboa-windows-amd64.exe

      - name: Upload distro rootfs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-rootfs
          path: jerboa-rootfs-amd64.tar.gz

  windows-installer-smoke:
    name: Windows Desktop Installer Smoke
    needs: [changes, windows-smoke-inputs]
    # Runs in two contexts: (1) every release — version bump / publish dispatch —
    # where it IS in publish-r2's `needs`, so a broken installer blocks the
    # release (caught pre-publication); and (2) PRs that touch the installer
    # surface (changes.outputs.installer), as a pre-merge check. Both share the
    # same producer (windows-smoke-inputs) so the two paths are identical.
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.version == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.installer == 'true')
    # Self-hosted Windows host with WSL2 + nested virtualization enabled (so the
    # imported jerboa distro gets /dev/kvm for firecracker), plus Node 22 and
    # git-bash. Label it `kvm` to reuse the environment's protection rules.
    environment: kvm
    runs-on: [self-hosted, windows, kvm]
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # Persistent self-hosted runner: a prior run that crashed mid-way could
      # leave a registered distro, the install dir, or host config behind. Wipe
      # all of it so every run starts from a pristine machine.
      - name: Pre-clean leftover jerboa state
        shell: powershell
        run: |
          # A pristine machine has nothing installed, so the uninstaller may be
          # absent. Start-Process raises a *terminating* error on a missing
          # -FilePath that -ErrorAction can't swallow, so guard with Test-Path
          # (same as the Cleanup step) instead of relying on SilentlyContinue.
          $uninst = 'C:\jerboa-desktop\Uninstall Jerboa Desktop.exe'
          if (Test-Path $uninst) {
            Start-Process -Wait -FilePath $uninst -ArgumentList '/S' -ErrorAction SilentlyContinue
          }
          # WSL may be absent on this host. Run through cmd with its own
          # redirection so the wsl stub's "not installed" message never becomes
          # a PowerShell NativeCommandError that fails the step; there's simply
          # nothing to unregister then.
          cmd /c "wsl.exe --unregister jerboa >nul 2>nul"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            'C:\jerboa-desktop', "$env:USERPROFILE\.jerboa", "$env:LOCALAPPDATA\jerboa"
          exit 0

      - name: Checkout jerboa (examples + smoke script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The desktop installer is built from a separate repo. A PAT with `repo`
      # scope on AitorConS/JerboaDesktop is required (private repo); store it as
      # the DESKTOP_REPO_TOKEN secret.
      - name: Checkout JerboaDesktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AitorConS/JerboaDesktop
          token: ${{ secrets.DESKTOP_REPO_TOKEN }}
          path: desktop
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      # Go is pre-installed on the self-hosted windows-virt runner; setup-go was
      # removed because it hung for ~20 min downloading the toolchain there.

      - name: Download freshly-built Windows CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-cli
          path: winbin/

      - name: Download freshly-built distro rootfs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-rootfs
          path: distro/

      - name: Build desktop installer with the fresh CLI injected
        working-directory: desktop
        run: |
          set -euo pipefail
          # Inject THIS build's jerboa.exe as the bundled CLI instead of running
          # scripts/fetch-cli.ts (which would pull the published-stable CLI from
          # R2). electron-builder's extraResources filter picks up vendor/cli.
          mkdir -p vendor/cli
          cp ../winbin/jerboa-windows-amd64.exe vendor/cli/jerboa.exe
          npm ci
          npm run build
          npx electron-builder --win --publish never

      - name: Silent-install the desktop app
        shell: powershell
        run: |
          $installer = Get-ChildItem desktop/dist/jerboa-desktop-setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "installer .exe not found in desktop/dist" }
          Write-Host "installing $($installer.FullName)"
          # NSIS assisted installer: /S silent, /D sets the install dir (must be
          # last, unquoted). Start-Process -Wait blocks until it finishes.
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S','/D=C:\jerboa-desktop'
          $cli = 'C:\jerboa-desktop\resources\bin\jerboa.exe'
          if (-not (Test-Path $cli)) { throw "installer did not place jerboa.exe at $cli" }

      - name: Run installer smoke (provision engine + boot 3 unikernels)
        env:
          # Unix path form for bash PATH; the NSIS PATH edit does not reach this
          # already-running shell, so point at the installed dir explicitly.
          JERBOA_BIN: /c/jerboa-desktop/resources/bin
        run: |
          set -euo pipefail
          export JERBOA_ROOTFS="$(pwd)/distro/jerboa-rootfs-amd64.tar.gz"
          export JERBOA_EXAMPLES="$(pwd)/examples"
          test -f "$JERBOA_ROOTFS" || { echo "rootfs not found at $JERBOA_ROOTFS"; exit 1; }
          bash scripts/windows-install-smoke.sh

      # Full teardown so nothing carries into the next run. The smoke script's
      # trap already stops the VMs; here we uninstall the app, unregister the
      # distro (wipes the daemon-side images/volumes), and delete the host-side
      # state dirs the uninstaller/unregister leave behind:
      #   %USERPROFILE%\.jerboa    config.toml, daemon.json, token, store, logs
      #   %LOCALAPPDATA%\jerboa    imported distro disk (distro/)
      #   C:\jerboa-desktop        the app install dir
      - name: Cleanup — uninstall, unregister distro, wipe host state
        if: always()
        shell: powershell
        run: |
          $uninst = 'C:\jerboa-desktop\Uninstall Jerboa Desktop.exe'
          if (Test-Path $uninst) {
            Start-Process -Wait -FilePath $uninst -ArgumentList '/S' -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3   # NSIS uninstaller relaunches from temp; let it finish
          }
          # WSL may be absent on this host. Run through cmd with its own
          # redirection so the wsl stub's "not installed" message never becomes
          # a PowerShell NativeCommandError that fails the step; there's simply
          # nothing to unregister then.
          cmd /c "wsl.exe --unregister jerboa >nul 2>nul"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `
            'C:\jerboa-desktop', "$env:USERPROFILE\.jerboa", "$env:LOCALAPPDATA\jerboa"
          exit 0

  publish-r2:
    name: Publish to R2
    runs-on: ubuntu-latest
    needs: [changes, build-release, build-distro, windows-installer-smoke]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.version == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    timeout-minutes: 15
    # Publishes the freshly built cli/daemon/distro (and the current desktop
    # release) straight to the R2 origin as a minisign-signed channel manifest —
    # no GitHub Releases round-trip. The kernel component is carried forward from
    # the existing signed manifest: its artifacts (incl. kernel-fc.img, which no
    # workflow rebuilds) already live in R2 under kernel/<ver>/ and are re-hashed
    # here unchanged. A kernel bump is published by its own pipeline.
    #
    # Required repository secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
    #   JERBOA_MINISIGN_SEED. Variables: R2_ACCOUNT_ID, R2_BUCKET,
    #   JERBOA_MINISIGN_KEYID.
    env:
      BASE_URL: https://releases.jerboa.dev
      ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ vars.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the default streaming checksum trailer the AWS CLI adds.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Build release tooling
        run: |
          go build -o bin/jerboa-manifest ./cmd/jerboa-manifest
          go build -o bin/jerboa-sign     ./cmd/jerboa-sign

      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist/
          merge-multiple: true

      - name: Download distro rootfs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distro-rootfs
          path: dist-distro/

      - name: Read CLI version + carry the kernel forward from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          echo "TAG=v$(cat VERSION.md | tr -d '[:space:]')" >> "$GITHUB_ENV"
          # The kernel component (incl. kernel-fc.img) is not rebuilt here — reuse
          # whatever version the current signed manifest points at; its files
          # already live in R2 under kernel/<ver>/.
          KVER="$(curl -fsSL "$BASE_URL/channels/stable.json" | jq -r '.components.kernel.version')"
          if [ -z "$KVER" ] || [ "$KVER" = "null" ]; then
            echo "::error::could not resolve kernel version from $BASE_URL/channels/stable.json"; exit 1
          fi
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          mkdir -p kern
          aws s3 cp "s3://$BUCKET/kernel/$KVER/" kern/ --recursive --endpoint-url "$ENDPOINT"

      - name: Stage bucket tree + spec
        run: |
          set -euo pipefail
          mkdir -p "pub/cli/$TAG" "pub/daemon/$TAG" "pub/distro/$TAG" \
                   "pub/kernel/$KVER" pub/channels
          cp dist/jerboa-linux-amd64        "pub/cli/$TAG/"
          cp dist/jerboa-linux-arm64        "pub/cli/$TAG/"
          cp dist/jerboa-windows-amd64.exe  "pub/cli/$TAG/"
          cp dist/jerboad-linux-amd64       "pub/daemon/$TAG/"
          cp dist-distro/jerboa-rootfs-amd64.tar.gz "pub/distro/$TAG/"
          cp kern/kernel.img kern/boot.img kern/kernel-fc.img \
             kern/mkfs-linux-amd64 kern/dump-linux-amd64 "pub/kernel/$KVER/"

          # The desktop app publishes independently (JerboaDesktop release.yml) to
          # the R2 desktop/ channel. Mirror its current version into the signed
          # manifest so `jerboa version` can report it. Optional: omit when absent.
          DESKTOP_JSON=""
          if curl -fsSL "$BASE_URL/desktop/latest.yml" -o desktop-latest.yml 2>/dev/null; then
            DVER="v$(sed -n 's/^version:[[:space:]]*//p' desktop-latest.yml | tr -d '[:space:]')"
            DFILE="$(sed -n 's/^path:[[:space:]]*//p' desktop-latest.yml | tr -d '[:space:]')"
            if [ -n "$DVER" ] && [ -n "$DFILE" ] && curl -fsSL "$BASE_URL/desktop/$DFILE" -o desktop-installer 2>/dev/null; then
              mkdir -p "pub/desktop/$DVER"
              cp desktop-installer "pub/desktop/$DVER/$DFILE"
              DESKTOP_JSON="\"desktop\": { \"version\": \"$DVER\", \"platforms\": { \"windows-amd64\": \"pub/desktop/$DVER/$DFILE\" } },"
            else
              echo "Desktop latest.yml present but incomplete; omitting desktop component."
            fi
          else
            echo "No desktop channel published yet; omitting desktop component."
          fi

          cat > spec.json <<EOF
          {
            "channel": "stable",
            "base": "$BASE_URL",
            "components": {
              "cli": {
                "version": "$TAG",
                "platforms": {
                  "windows-amd64": "pub/cli/$TAG/jerboa-windows-amd64.exe",
                  "linux-amd64":   "pub/cli/$TAG/jerboa-linux-amd64",
                  "linux-arm64":   "pub/cli/$TAG/jerboa-linux-arm64"
                }
              },
              "daemon": {
                "version": "$TAG",
                "platforms": { "linux-amd64": "pub/daemon/$TAG/jerboad-linux-amd64" }
              },
              "distro": {
                "version": "$TAG", "kernel": "$KVER",
                "file": "pub/distro/$TAG/jerboa-rootfs-amd64.tar.gz"
              },
              ${DESKTOP_JSON}
              "kernel": {
                "version": "$KVER",
                "files": {
                  "kernel.img":  "pub/kernel/$KVER/kernel.img",
                  "boot.img":    "pub/kernel/$KVER/boot.img",
                  "kernel-fc.img": "pub/kernel/$KVER/kernel-fc.img",
                  "mkfs":        "pub/kernel/$KVER/mkfs-linux-amd64",
                  "dump":        "pub/kernel/$KVER/dump-linux-amd64"
                }
              }
            }
          }
          EOF

      - name: Generate + sign manifest
        env:
          JERBOA_MINISIGN_SEED: ${{ secrets.JERBOA_MINISIGN_SEED }}
          KEY_ID: ${{ vars.JERBOA_MINISIGN_KEYID }}
        run: |
          set -euo pipefail
          ./bin/jerboa-manifest -spec spec.json -out pub/channels/stable.json
          ./bin/jerboa-sign -in pub/channels/stable.json \
            -key-id "$KEY_ID" \
            -comment "channel:stable tag:$TAG"
          cat pub/channels/stable.json

      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Immutable versioned artifacts: long cache. The channel manifest must
          # never be cached — it is the pointer clients re-read every check.
          aws s3 sync pub/ "s3://$BUCKET/" \
            --endpoint-url "$ENDPOINT" \
            --exclude 'channels/*' \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp pub/channels/stable.json "s3://$BUCKET/channels/stable.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/json \
            --cache-control 'no-cache'
          aws s3 cp pub/channels/stable.json.minisig "s3://$BUCKET/channels/stable.json.minisig" \
            --endpoint-url "$ENDPOINT" \
            --cache-control 'no-cache'

      - name: Verify downloaded public release artifacts
        run: python3 scripts/verify-release.py pub/channels/stable.json "$BASE_URL" "$TAG"

  publish-packages:
    needs: publish-r2
    permissions:
      contents: write
    uses: ./.github/workflows/packages.yml
    secrets: inherit

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-out

      - name: HTML report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage.html
