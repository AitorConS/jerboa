name: Sigstore end to end
# Signs a statement with public-good Sigstore (Fulcio, Rekor, the timestamp
# authority, the TUF trusted root) with this job's OIDC token, and verifies
# it, as a signed push and a verifying pull would. It runs when the signing
# code changes, on pull requests from this repository (forks get no OIDC
# token), and on request; each run adds an entry to the public Rekor log.
'on':
  pull_request:
    paths:
    - internal/registry/attest/**
    - .github/workflows/sigstore-e2e.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sigstore:
    name: Sign and verify with Sigstore
    if: github.repository == 'AitorConS/jerboa' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The OIDC token Fulcio certifies.
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.4
        cache: true
    - name: Sign and verify
      run: go test -tags sigstore_e2e -count=1 -v -run TestSigstoreRoundTrip ./internal/registry/attest/
