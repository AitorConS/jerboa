name: Registry Worker
# Typechecks and tests the registry Worker (registry/worker) against local R2
# and D1 (Miniflare), checks both environments still bundle, and runs the Go
# client end to end against the Worker under wrangler dev.
'on':
  pull_request:
    paths:
    - registry/worker/**
    - internal/registry/**
    - tests/registry/**
    - .github/workflows/registry.yml
  push:
    branches:
    - main
    paths:
    - registry/worker/**
    - internal/registry/**
    - tests/registry/**
    - .github/workflows/registry.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: registry/worker
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - name: Install pnpm
      run: npm install -g pnpm@11.25.0
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Typecheck
      run: pnpm exec tsc --noEmit
    - name: Test
      run: pnpm exec vitest run
    - name: Bundle staging and production
      run: |
        pnpm exec wrangler deploy --dry-run --env staging --outdir "$RUNNER_TEMP/staging"
        pnpm exec wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/production"
  e2e:
    name: Go client against the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.2
        cache: true
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: '24'
    - name: Install the Worker
      working-directory: registry/worker
      run: |
        npm install -g pnpm@11.25.0
        pnpm install --frozen-lockfile
    - name: Push, pull and auth against wrangler dev
      run: go test -tags registry_e2e -count=1 -v -timeout 10m ./tests/registry/...
