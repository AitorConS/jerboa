name: Kernel Build

# Standalone build diagnostics; never writes stable. Product release.yml stages
# the same-run kernel build, validates QEMU/Firecracker boots, and includes it
# in the signed candidate. Only promote.yml publishes those tested bytes.
# See docs/release-process.md.

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - '.github/workflows/kernel-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate kernel artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.1
          cache: true

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib nasm qemu-utils

      - name: Build kernel and mkfs
        run: make kernel && make -C kernel tools

      - name: Stage artifacts
        run: |
          mkdir -p dist
          test -f kernel/output/tools/bin/mkfs \
            || (echo "ERROR: mkfs not built" && exit 1)
          test -f kernel/output/tools/bin/dump \
            || (echo "ERROR: dump not built" && exit 1)
          test -f kernel/output/platform/pc/bin/kernel.img \
            || (echo "ERROR: kernel.img not built" && exit 1)
          test -f kernel/output/platform/pc/boot/boot.img \
            || (echo "ERROR: boot.img not built" && exit 1)
          test -f kernel/output/platform/pc/bin/kernel.elf \
            || (echo "ERROR: kernel.elf not built" && exit 1)
          cp kernel/output/tools/bin/mkfs             dist/mkfs-linux-amd64
          cp kernel/output/tools/bin/dump             dist/dump-linux-amd64
          cp kernel/output/platform/pc/bin/kernel.img dist/kernel.img
          cp kernel/output/platform/pc/boot/boot.img  dist/boot.img
          # Firecracker boots a PVH ELF kernel (no BIOS boot sector), unlike the
          # QEMU kernel.img. The Nanos pc kernel.elf already carries the PVH note
          # (Xen ELFNOTE type 18); strip debug info (keeping symbols, same recipe
          # as kernel.img) to produce a lean kernel-fc.img candidate. NOTE: this
          # is rebuilt from repo source and is NOT byte-identical to the manually
          # produced v0.2.0 kernel-fc.img in R2 — it must pass the Firecracker
          # native boot validation before it is published as a new kernel
          # version through the product release candidate.
          strip -g kernel/output/platform/pc/bin/kernel.elf -o dist/kernel-fc.img
          chmod +x dist/mkfs-linux-amd64 dist/dump-linux-amd64
          VERSION="v$(cat kernel/VERSION | tr -d '[:space:]')"
          echo "$VERSION" > dist/kernel-version.txt
          file dist/mkfs-linux-amd64 dist/dump-linux-amd64 dist/kernel.img dist/boot.img dist/kernel-fc.img

      - name: Validate kernel-fc.img is a Firecracker-bootable PVH ELF
        run: |
          set -euo pipefail
          # Must be an x86-64 executable ELF...
          readelf -h dist/kernel-fc.img | grep -q 'Type:.*EXEC' \
            || { echo "ERROR: kernel-fc.img is not ET_EXEC"; exit 1; }
          readelf -h dist/kernel-fc.img | grep -q 'Machine:.*X86-64' \
            || { echo "ERROR: kernel-fc.img is not x86-64"; exit 1; }
          # ...carrying the PVH entry note Firecracker needs to boot it. Nanos
          # emits it as a Xen ELF note (namespace "Xen").
          readelf -n dist/kernel-fc.img | grep -qi 'Xen' \
            || { echo "ERROR: kernel-fc.img has no PVH/Xen ELF note — Firecracker cannot boot it"; exit 1; }
          echo "kernel-fc.img OK: x86-64 PVH ELF"

      - name: Upload kernel artifacts (build validation)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-artifacts
          path: dist/
