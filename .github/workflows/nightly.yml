name: Nightly
'on':
  schedule:
  - cron: 0 2 * * *
  workflow_dispatch:
    inputs:
      suite:
        description: Run all nightly checks or isolate kernel host tests
        type: choice
        default: all
        options:
        - all
        - kernel
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.27.4
        cache: true
    - name: Run unit tests
      run: go test ./cmd/... ./internal/... -race -shuffle=on -count=1
    if: inputs.suite != 'kernel'
  kernel-tests:
    name: Kernel host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install host test toolchain
      run: |-
        sudo apt-get update -q
        sudo apt-get install -y gcc-multilib nasm ent
    - name: Build test code generator
      run: make -C kernel contgen
    - name: Run kernel host suite
      run: make test-kernel
  integration-tests:
    name: Integration Tests
    needs:
    - unit-tests
    runs-on:
    - self-hosted
    - linux
    - kvm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.27.4
        cache: false
    - name: Check KVM
      run: |
        test -e /dev/kvm || (echo "/dev/kvm not found" && exit 1)
        test -r /dev/kvm && test -w /dev/kvm || (echo "Add runner user to kvm group: sudo usermod -aG kvm \$USER" && exit 1)
    # The Firecracker tests boot the in-tree kernel, which no step of this
    # job used to build: they failed every night.
    - name: Build kernel and tools
      run: make kernel && make -C kernel tools
    - name: Build CLI binaries
      run: make build
    - name: Run integration tests
      run: |
        # Through the script: guest networking needs CAP_NET_ADMIN, which
        # the runner user gets from sudo (see scripts/run-kvm-tests.sh).
        scripts/run-kvm-tests.sh integration ./tests/integration -test.v -test.timeout 10m
        go test -tags integration -count=1 -timeout 10m -v ./internal/tools
    if: inputs.suite != 'kernel'
  e2e-tests:
    name: E2E Tests (all scenarios)
    needs:
    - integration-tests
    runs-on:
    - self-hosted
    - linux
    - kvm
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.27.4
        cache: false
    - name: Check KVM
      run: |
        test -e /dev/kvm || (echo "/dev/kvm not found" && exit 1)
        test -r /dev/kvm && test -w /dev/kvm || (echo "Add runner user to kvm group: sudo usermod -aG kvm \$USER" && exit 1)
    - name: Build kernel and tools
      run: make kernel && make -C kernel tools
    - name: Build CLI binaries
      run: make build
    # Every scenario, the slow and host-level ones included: more rounds of
    # the crash tests, the damaged-state matrix, a full host disk, the
    # firewall reload. Firecracker is the hypervisor of the tests that do
    # not run on both.
    - name: Run E2E tests (all scenarios)
      run: scripts/run-e2e.sh -test.v -test.timeout 75m
      env:
        JERBOA_E2E_SLOW: '1'
    # The fast set again with QEMU as the hypervisor of every test.
    - name: Run E2E tests (QEMU)
      if: always()
      run: scripts/run-e2e.sh -test.v -test.timeout 30m
      env:
        JERBOA_E2E_HYPERVISOR: qemu
    if: always() && inputs.suite != 'kernel'
  benchmarks:
    name: Benchmark Suite
    runs-on:
    - self-hosted
    - linux
    - kvm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.27.4
        cache: false
    - name: Run benchmarks
      # -run '^$': benchmarks only. Without it every unit test of the repository
      # also ran three times here and the job never finished in its time.
      run: |
        set -o pipefail
        go test ./... -run '^$' -bench=. -benchmem -benchtime=5s -count=3 | tee benchmark-results.txt
    - name: Upload benchmark results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: benchmark-results-${{ github.run_id }}
        path: benchmark-results.txt
    if: inputs.suite != 'kernel'
  image-benchmarks:
    name: Image Build & Boot Benchmarks
    runs-on:
    - self-hosted
    - linux
    - kvm
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.27.4
        cache: false
    - name: Check KVM
      run: |
        test -e /dev/kvm || (echo "/dev/kvm not found" && exit 1)
        test -r /dev/kvm && test -w /dev/kvm || (echo "Add runner user to kvm group: sudo usermod -aG kvm \$USER" && exit 1)
    - name: Verify toolchain
      run: "for tool in gcc nasm qemu-system-x86_64 firecracker; do\n  command -v \"$tool\" || { echo\
        \ \"ERROR: $tool not found \u2014 see runner setup docs (apt for gcc/nasm/qemu, GitHub releases\
        \ for firecracker)\"; exit 1; }\ndone\n"
    - name: Build kernel and tools
      run: make kernel && make -C kernel tools
    - name: Build CLI
      run: make build
    # Daemons, networks and jerboa-bench: scripts/nightly-image-bench.sh runs
    # them under sudo when the runner lacks CAP_NET_ADMIN, as the E2E tests do.
    - name: Start QEMU and Firecracker daemons
      run: scripts/nightly-image-bench.sh start
    - name: Run jerboa-bench
      run: scripts/nightly-image-bench.sh run
    - name: Daemon and VM logs
      if: failure()
      run: scripts/nightly-image-bench.sh diagnose
    - name: Stop daemons
      if: always()
      run: scripts/nightly-image-bench.sh stop
    - name: Write job summary
      if: always()
      run: |
        {
          echo "## Image & Runtime Benchmarks"
          echo ""
          echo "Same static test binary in every runtime; 30 randomized runs after 3 warmups."
          echo "Memory: Jerboa = VMM process RSS, Docker = container cgroup usage."
          echo ""
          echo '```'
          cat bench-summary.txt 2>/dev/null || echo "benchmark did not complete"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: image-benchmarks-${{ github.run_id }}
        path: |
          bench-image.json
          bench-image.csv
          bench-summary.txt
          ${{ env.BENCH_ROOT }}/fc-metrics/
        if-no-files-found: ignore
    # The KVM runner is persistent: without this each night leaves its images,
    # VM disks and logs in /tmp.
    - name: Remove the benchmark directory
      if: always()
      run: scripts/nightly-image-bench.sh clean
    if: inputs.suite != 'kernel'
  fuzz-extended:
    name: Fuzz (extended)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.27.4
        cache: true
    # The targets share a fixed budget, so the job takes the same time however
    # many there are: three minutes each stopped fitting long ago, and the job
    # was cancelled every night after the first few.
    - name: Fuzz every target within a shared budget
      run: |
        set -euo pipefail
        targets=()
        failed=()
        for pkg in $(go list ./cmd/... ./internal/...); do
          for fn in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
            targets+=("${pkg} ${fn}")
          done
        done
        [ "${#targets[@]}" -gt 0 ] || { echo "::error::no fuzz target found"; exit 1; }
        each=$(( 2400 / ${#targets[@]} ))
        [ "$each" -ge 10 ] || each=10
        echo "${#targets[@]} targets, ${each}s each"
        for target in "${targets[@]}"; do
          read -r pkg fn <<<"$target"
          echo "::group::fuzz ${fn} (${pkg})"
          # One target that fails does not hide the ones after it: every
          # target runs, and the job fails at the end naming them all.
          if ! go test -run '^$' -fuzz "^${fn}$" -fuzztime="${each}s" "$pkg"; then
            failed+=("${fn} (${pkg})")
          fi
          echo "::endgroup::"
        done
        if [ "${#failed[@]}" -gt 0 ]; then
          printf '::error::fuzz target failed: %s\n' "${failed[@]}"
          exit 1
        fi
    - name: Upload any fuzz crashers
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fuzz-crashers-${{ github.run_id }}
        path: '**/testdata/fuzz/**'
        if-no-files-found: ignore
    if: inputs.suite != 'kernel'
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.27.4
        cache: true
    - name: govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
        govulncheck ./...
    - name: trivy filesystem scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        exit-code: 1
        skip-dirs: examples
        version: v0.75.0
    if: inputs.suite != 'kernel'
  report:
    name: Nightly report
    runs-on: ubuntu-latest
    if: always()
    needs:
    - unit-tests
    - kernel-tests
    - integration-tests
    - e2e-tests
    - benchmarks
    - image-benchmarks
    - fuzz-extended
    - security-scan
    steps:
    - name: Write job results
      run: |-
        python3 - <<'CHECK'
        import json,os
        jobs=json.loads(os.environ["JOBS"])
        with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
         for name,job in jobs.items():f.write(f"- {name}: {job['result']}\n")
        CHECK
      env:
        JOBS: ${{ toJSON(needs) }}
