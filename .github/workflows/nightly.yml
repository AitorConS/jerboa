name: Nightly
'on':
  schedule:
  - cron: 0 2 * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: true
    - name: Run unit tests
      run: go test ./cmd/... ./internal/... -race -shuffle=on -count=1
  kernel-tests:
    name: Full Kernel Test Suite
    runs-on:
    - self-hosted
    - linux
    - kvm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: false
    - name: Provision kernel test tools
      run: |-
        # The owned KVM runner already supplies the compiler and emulator.
        # Install the small entropy test utility into this job, without sudo.
        if ! command -v ent >/dev/null; then
          tools_dir="$RUNNER_TEMP/kernel-test-tools"
          mkdir -p "$tools_dir"
          cd "$tools_dir"
          apt-get download ent
          dpkg-deb --extract ./ent_*.deb "$tools_dir/root"
          echo "$tools_dir/root/usr/bin" >> "$GITHUB_PATH"
        fi
    - name: Verify toolchain
      run: "for tool in go gcc nasm qemu-system-x86_64 ent python3; do\n  command -v \"$tool\" || { echo\
        \ \"ERROR: $tool not found \u2014 pre-install on runner: sudo apt-get install -y gcc-multilib\
        \ nasm qemu-system-x86\"; exit 1; }\ndone\n"
    - name: Check KVM
      run: |
        test -e /dev/kvm || (echo "/dev/kvm not found" && exit 1)
        test -r /dev/kvm && test -w /dev/kvm || (echo "Add runner user to kvm group: sudo usermod -aG kvm \$USER" && exit 1)
    - name: Build kernel
      run: make kernel
    - name: Run kernel test suite
      run: make test-kernel
  integration-tests:
    name: Integration Tests
    needs:
    - unit-tests
    runs-on:
    - self-hosted
    - linux
    - kvm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: false
    - name: Check KVM
      run: |
        test -e /dev/kvm || (echo "/dev/kvm not found" && exit 1)
        test -r /dev/kvm && test -w /dev/kvm || (echo "Add runner user to kvm group: sudo usermod -aG kvm \$USER" && exit 1)
    - name: Build CLI binaries
      run: make build
    - name: Run integration tests
      run: go test -tags integration -count=1 -timeout 10m -v ./tests/integration/...
  benchmarks:
    name: Benchmark Suite
    runs-on:
    - self-hosted
    - linux
    - kvm
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: false
    - name: Run benchmarks
      run: go test ./... -bench=. -benchmem -benchtime=5s -count=3 | tee benchmark-results.txt
    - name: Upload benchmark results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: benchmark-results-${{ github.run_id }}
        path: benchmark-results.txt
  image-benchmarks:
    name: Image Build & Boot Benchmarks
    runs-on:
    - self-hosted
    - linux
    - kvm
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: false
    - name: Check KVM
      run: |
        test -e /dev/kvm || (echo "/dev/kvm not found" && exit 1)
        test -r /dev/kvm && test -w /dev/kvm || (echo "Add runner user to kvm group: sudo usermod -aG kvm \$USER" && exit 1)
    - name: Verify toolchain
      run: "for tool in gcc nasm qemu-system-x86_64 firecracker; do\n  command -v \"$tool\" || { echo\
        \ \"ERROR: $tool not found \u2014 see runner setup docs (apt for gcc/nasm/qemu, GitHub releases\
        \ for firecracker)\"; exit 1; }\ndone\n"
    - name: Build kernel and tools
      run: make kernel && make -C kernel tools
    - name: Build CLI
      run: make build
    - name: Start QEMU and Firecracker daemons
      run: |
        BENCH_ROOT=$(mktemp -d)
        BENCH_TOOLS="${BENCH_ROOT}/tools"
        mkdir -p "${BENCH_TOOLS}" "${BENCH_ROOT}/qemu" "${BENCH_ROOT}/fc"
        # Stage the freshly built kernel toolchain so the QEMU daemon resolves
        # mkfs/boot.img/kernel.img locally instead of downloading a release.
        cp kernel/output/tools/bin/mkfs "${BENCH_TOOLS}/mkfs"
        cp kernel/output/platform/pc/boot/boot.img "${BENCH_TOOLS}/boot.img"
        cp kernel/output/platform/pc/bin/kernel.img "${BENCH_TOOLS}/kernel.img"
        echo "BENCH_ROOT=${BENCH_ROOT}" >> "$GITHUB_ENV"
        HOME="${BENCH_ROOT}/qemu" ./dist/jerboad --host "unix://${BENCH_ROOT}/qemu.sock" --tools-dir "${BENCH_TOOLS}" \
          --store "${BENCH_ROOT}/qemu/images" > "${BENCH_ROOT}/qemu.log" 2>&1 &
        echo "QEMU_PID=$!" >> "$GITHUB_ENV"
        # The Firecracker daemon downloads kernel-fc.img on first start; it
        # uses the staged mkfs so both images come from this commit.
        HOME="${BENCH_ROOT}/fc" ./dist/jerboad --host "unix://${BENCH_ROOT}/fc.sock" --hypervisor firecracker \
          --tools-dir "${BENCH_TOOLS}" --store "${BENCH_ROOT}/fc/images" \
          --fc-metrics-dir "${BENCH_ROOT}/fc-metrics" > "${BENCH_ROOT}/fc.log" 2>&1 &
        echo "FC_PID=$!" >> "$GITHUB_ENV"
        for i in $(seq 1 120); do
          [ -S "${BENCH_ROOT}/qemu.sock" ] && [ -S "${BENCH_ROOT}/fc.sock" ] && break
          sleep 1
        done
        [ -S "${BENCH_ROOT}/qemu.sock" ] || { cat "${BENCH_ROOT}/qemu.log"; exit 1; }
        [ -S "${BENCH_ROOT}/fc.sock" ] || { cat "${BENCH_ROOT}/fc.log"; exit 1; }
        HOME="${BENCH_ROOT}/qemu" ./dist/jerboa --host "unix://${BENCH_ROOT}/qemu.sock" network create benchq --subnet 10.231.0.0/24
        HOME="${BENCH_ROOT}/fc" ./dist/jerboa --host "unix://${BENCH_ROOT}/fc.sock" network create benchfc --subnet 10.232.0.0/24
    - name: Run jerboa-bench
      run: |
        go build -o dist/jerboa-bench ./cmd/jerboa-bench
        RUNTIMES=(
          --runtime "qemu=jerboa,host=unix://${BENCH_ROOT}/qemu.sock,network=benchq,store=${BENCH_ROOT}/qemu/images"
          --runtime "fc=jerboa,host=unix://${BENCH_ROOT}/fc.sock,network=benchfc,store=${BENCH_ROOT}/fc/images"
          --runtime "fc-compact=jerboa,host=unix://${BENCH_ROOT}/fc.sock,network=benchfc,store=${BENCH_ROOT}/fc/images,layout=compact"
        )
        if docker info >/dev/null 2>&1; then
          RUNTIMES+=(--runtime docker=docker)
        else
          echo "::notice::docker unavailable on this runner; benchmarking Jerboa backends only"
        fi
        ./dist/jerboa-bench --jerboa ./dist/jerboa "${RUNTIMES[@]}" \
          --runs 30 --warmup 3 --seed "${GITHUB_RUN_ID}" \
          --idle-sample 5s --load-duration 5s --load-concurrency 16 --load-direct \
          --out bench-image.json | tee bench-summary.txt
    - name: Stop daemons
      if: always()
      run: |
        [ -n "${QEMU_PID}" ] && kill "${QEMU_PID}" 2>/dev/null || true
        [ -n "${FC_PID}" ] && kill "${FC_PID}" 2>/dev/null || true
    - name: Write job summary
      if: always()
      run: |
        {
          echo "## Image & Runtime Benchmarks"
          echo ""
          echo "Same static test binary in every runtime; 30 randomized runs after 3 warmups."
          echo "Memory: Jerboa = VMM process RSS, Docker = container cgroup usage."
          echo ""
          echo '```'
          cat bench-summary.txt 2>/dev/null || echo "benchmark did not complete"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: image-benchmarks-${{ github.run_id }}
        path: |
          bench-image.json
          bench-image.csv
          bench-summary.txt
          ${{ env.BENCH_ROOT }}/fc-metrics/
        if-no-files-found: ignore
  fuzz-extended:
    name: Fuzz (extended)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: true
    - name: Fuzz every target for several minutes
      run: |
        set -euo pipefail
        for pkg in $(go list ./cmd/... ./internal/...); do
          for fn in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
            echo "::group::fuzz ${fn} (${pkg})"
            go test -run '^$' -fuzz "^${fn}$" -fuzztime=3m "$pkg"
            echo "::endgroup::"
          done
        done
    - name: Upload any fuzz crashers
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fuzz-crashers-${{ github.run_id }}
        path: '**/testdata/fuzz/**'
        if-no-files-found: ignore
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: true
    - name: govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
        govulncheck ./...
    - name: trivy filesystem scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        exit-code: 1
        skip-dirs: examples
  report:
    name: Nightly report
    runs-on: ubuntu-latest
    if: always()
    needs:
    - unit-tests
    - kernel-tests
    - integration-tests
    - benchmarks
    - image-benchmarks
    - fuzz-extended
    - security-scan
    steps:
    - name: Write job results
      run: |-
        python3 - <<'CHECK'
        import json,os
        jobs=json.loads(os.environ["JOBS"])
        with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
         for name,job in jobs.items():f.write(f"- {name}: {job['result']}\n")
        CHECK
      env:
        JOBS: ${{ toJSON(needs) }}
