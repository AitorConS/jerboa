name: Package Build
'on':
  push:
    branches:
    - main
    paths:
    - scripts/build-*.sh
    - scripts/release/packages.json
    - .github/workflows/packages.yml
  workflow_dispatch:
    inputs:
      package:
        description: Package name or all
        required: true
        default: all
        type: string
permissions:
  contents: read
concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-package:
    name: Build ${{ matrix.package }}:${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install package build dependencies
      run: |-
        sudo apt-get update -q
        sudo apt-get install -y build-essential autoconf automake libtool pkg-config bison flex libssl-dev zlib1g-dev libffi-dev libreadline-dev libyaml-dev libgdbm-dev libsqlite3-dev libbz2-dev liblzma-dev libncurses-dev libxml2-dev libonig-dev unzip
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: false
    - name: Build CLI binaries
      run: make build
    - name: Fetch and verify source
      id: fetch
      env:
        SOURCE_URL: ${{ matrix.source_url }}
        EXPECTED_SHA256: ${{ matrix.sha256 }}
      run: "if [ -z \"${EXPECTED_SHA256}\" ]; then\n  echo \"::error::No sha256 pinned for this package\
        \ \u2014 refusing to build unverified source.\"\n  exit 1\nfi\nSRC=\"${RUNNER_TEMP}/pkg-source\"\
        \ncurl -fSL --retry 3 -o \"${SRC}\" \"${SOURCE_URL}\"\necho \"${EXPECTED_SHA256}  ${SRC}\" | sha256sum\
        \ -c - || {\n  echo \"::error::Checksum mismatch for ${SOURCE_URL}\"\n  echo \"expected: ${EXPECTED_SHA256}\"\
        \n  echo \"actual:   $(sha256sum \"${SRC}\" | cut -d' ' -f1)\"\n  exit 1\n}\necho \"verified_src=${SRC}\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Build package
      env:
        PACKAGE_NAME: ${{ matrix.package }}
        PACKAGE_VERSION: ${{ matrix.version }}
        SOURCE_URL: file://${{ steps.fetch.outputs.verified_src }}
        BUILD_SCRIPT: ${{ matrix.build_script }}
      run: "if [ -f \"${BUILD_SCRIPT}\" ]; then\n  bash \"${BUILD_SCRIPT}\"\nelse\n  echo \"Build script\
        \ ${BUILD_SCRIPT} not found \u2014 skipping\"\n  exit 1\nfi\n"
    - name: Create package archive
      run: |
        BINARY="dist/pkg/${{ matrix.package }}/${{ matrix.version }}"
        if [ ! -d "$BINARY" ]; then
          echo "Error: package output directory not found at $BINARY"
          exit 1
        fi
        ./dist/jerboa pkg create ${{ matrix.package }}:${{ matrix.version }} \
          "$BINARY" \
          --description "${{ matrix.package }} ${{ matrix.version }} runtime" \
          --runtime ${{ matrix.package }}
    - name: Upload package artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: package-${{ matrix.package }}-${{ matrix.version }}
        path: |
          ~/.jerboa/packages/${{ matrix.package }}/${{ matrix.version }}/
    needs:
    - select
    if: needs.select.outputs.any == 'true'
  publish-index:
    name: Update Package Index
    permissions:
      contents: write
    needs:
    - build-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Download package artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: package-*
        path: dist/packages/
        merge-multiple: false
    - name: Publish archives and index
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        mkdir -p dist/publish
        if gh release view pkg-index >/dev/null 2>&1; then
          gh release download pkg-index --pattern packages.json --dir dist/publish
        else
          gh release create pkg-index --title "Package index" --notes "Runtime package archives and index."
        fi
        python3 scripts/package-index.py dist/packages dist/publish "$GH_REPO"
        find dist/publish -name '*.tar.gz' -exec gh release upload pkg-index {} --clobber \;
        gh release upload pkg-index dist/publish/packages.json --clobber
        curl --fail --location --retry 5 --retry-all-errors \
          "https://github.com/$GH_REPO/releases/download/pkg-index/packages.json" -o dist/public-index.json
        python3 -c 'import json; a=json.load(open("dist/publish/packages.json")); b=json.load(open("dist/public-index.json")); assert a==b'
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select affected packages
      run: python3 scripts/release/select-packages.py
      id: select
      env:
        PACKAGE: ${{ inputs.package }}
        BEFORE: ${{ github.event.before }}
